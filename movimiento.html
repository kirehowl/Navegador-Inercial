<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegador Inercial - Panel de Sensores</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            text-align: center;
            color: #38bdf8;
        }
        #permission-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        #permission-btn:active {
            background-color: #0369a1;
        }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            border: 1px: #334155;
        }
        .card h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-family: monospace;
            font-size: 1rem;
        }
        .label {
            color: #94a3b8;
        }
        .value {
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Panel de Navegación Inercial</h1>

    <!-- Botón de activación (Requerido por iOS y Android modernos para leer sensores) -->
    <button id="permission-btn" onclick="requestSensors()">Activar Sensores y GPS</button>

    <div class="dashboard">
        <!-- 1. GPS -->
        <div class="card">
            <h2>📍 Posicionamiento GPS</h2>
            <div class="data-row"><span class="label">Latitud:</span> <span id="gps-lat" class="value">0.000000</span></div>
            <div class="data-row"><span class="label">Longitud:</span> <span id="gps-lon" class="value">0.000000</span></div>
            <div class="data-row"><span class="label">Altitud:</span> <span id="gps-alt" class="value">0.00</span> m</div>
            <div class="data-row"><span class="label">Precisión GPS:</span> <span id="gps-acc" class="value">0.0</span> m</div>
        </div>

        <!-- 2. Acelerómetro (3 Ejes) -->
        <div class="card">
            <h2>📈 Acelerómetro (3 Ejes)</h2>
            <div class="data-row"><span class="label">Eje X:</span> <span id="acc-x" class="value">0.00</span> m/s²</div>
            <div class="data-row"><span class="label">Eje Y:</span> <span id="acc-y" class="value">0.00</span> m/s²</div>
            <div class="data-row"><span class="label">Eje Z:</span> <span id="acc-z" class="value">0.00</span> m/s²</div>
        </div>

        <!-- 3. Giroscopio (3 Ejes) -->
        <div class="card">
            <h2>🔄 Giroscopio (3 Ejes)</h2>
            <div class="data-row"><span class="label">Eje X (Alpha):</span> <span id="gyro-x" class="value">0.00</span> °/s</div>
            <div class="data-row"><span class="label">Eje Y (Beta):</span> <span id="gyro-y" class="value">0.00</span> °/s</div>
            <div class="data-row"><span class="label">Eje Z (Gamma):</span> <span id="gyro-z" class="value">0.00</span> °/s</div>
        </div>
    </div>

    <script>
        let sensorData = {
            accel: { x: 0, y: 0, z: 0 },
            gyro: { x: 0, y: 0, z: 0 },
            gps: { lat: 0, lon: 0, alt: 0, accuracy: 0 }
        };

        function requestSensors() {
            // 1. Solicitar permisos para dispositivos iOS (Safari 13+)
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            startListeners();
                        } else {
                            alert("Permiso de sensores denegado.");
                        }
                    })
                    .catch(console.error);
            } else {
                // Android y otros navegadores estándar
                startListeners();
            }

            // Ocultar botón tras hacer clic
            document.getElementById('permission-btn').style.display = 'none';
        }

        function startListeners() {
            // Escuchar Acelerómetro y Giroscopio
            window.addEventListener('devicemotion', (event) => {
                if (event.acceleration) {
                    sensorData.accel.x = event.acceleration.x ? event.acceleration.x.toFixed(2) : '0.00';
                    sensorData.accel.y = event.acceleration.y ? event.acceleration.y.toFixed(2) : '0.00';
                    sensorData.accel.z = event.acceleration.z ? event.acceleration.z.toFixed(2) : '0.00';
                }

                if (event.rotationRate) {
                    sensorData.gyro.x = event.rotationRate.alpha ? event.rotationRate.alpha.toFixed(2) : '0.00';
                    sensorData.gyro.y = event.rotationRate.beta ? event.rotationRate.beta.toFixed(2) : '0.00';
                    sensorData.gyro.z = event.rotationRate.gamma ? event.rotationRate.gamma.toFixed(2) : '0.00';
                }
            });

            // Escuchar GPS en tiempo real
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        sensorData.gps.lat = position.coords.latitude.toFixed(6);
                        sensorData.gps.lon = position.coords.longitude.toFixed(6);
                        sensorData.gps.alt = position.coords.altitude !== null ? position.coords.altitude.toFixed(2) : 'N/A';
                        sensorData.gps.accuracy = position.coords.accuracy.toFixed(1);
                    },
                    (error) => {
                        console.error("Error GPS:", error.message);
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            } else {
                alert("La geolocalización no está soportada en este navegador.");
            }

            // Bucle optimizado para refrescar la interfaz visual sin saturar el navegador
            setInterval(updateUI, 100);
        }

        function updateUI() {
            // Actualizar GPS
            document.getElementById('gps-lat').innerText = sensorData.gps.lat;
            document.getElementById('gps-lon').innerText = sensorData.gps.lon;
            document.getElementById('gps-alt').innerText = sensorData.gps.alt;
            document.getElementById('gps-acc').innerText = sensorData.gps.accuracy;

            // Actualizar Acelerómetro
            document.getElementById('acc-x').innerText = sensorData.accel.x;
            document.getElementById('acc-y').innerText = sensorData.accel.y;
            document.getElementById('acc-z').innerText = sensorData.accel.z;

            // Actualizar Giroscopio
            document.getElementById('gyro-x').innerText = sensorData.gyro.x;
            document.getElementById('gyro-y').innerText = sensorData.gyro.y;
            document.getElementById('gyro-z').innerText = sensorData.gyro.z;
        }
    </script>
</body>
</html>
